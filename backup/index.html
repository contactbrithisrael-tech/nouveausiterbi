<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rite Brith Israël – Rite Maçonnique Kabbalistique de 33 Degrés</title>
  <meta name="description" content="Rite Maçonnique Kabbalistique de 33 degrés. Alliance de Lumière entre les Peuples, fidélité à la Tradition Hébraïque, universalité de la Franc-Maçonnerie.">
  <meta property="og:title"       content="Rite Brith Israël">
  <meta property="og:description" content="Rite Maçonnique Kabbalistique de 33 degrés.">
  <meta property="og:url"         content="https://brith-israel.org">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
</head>
<body>

<!-- NAVBAR — générée par app.js via config.js -->
<header class="navbar" id="navbar">
  <div class="navbar__brand" id="navbar-brand"></div>
  <button class="navbar__burger" id="burger-btn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <nav class="navbar__menu" id="nav-menu" aria-hidden="true">
    <ul id="nav-links"></ul>
  </nav>
  <div class="navbar__overlay" id="nav-overlay"></div>
</header>

<!-- HERO — généré par app.js -->
<section class="hero" id="accueil">
  <div class="hero__stars" id="stars-container"></div>
  <div class="hero__banner" id="hero-banner"></div>
  <div class="hero__seal">
    <img src="" id="hero-seal" alt="Sceau du Rite Brith Israël" class="hero__seal-img">
  </div>
  <h1 class="hero__title" id="hero-title"></h1>
  <p class="hero__subtitle" id="hero-subtitle"></p>
  <div class="hero__cta" id="hero-cta"></div>
  <div class="hero__ornament"><span class="ornament__star">✦</span><span class="ornament__star ornament__star--sm">✧</span><span class="ornament__star">✦</span></div>
</section>

<!-- RITE — généré par app.js -->
<section class="section section--dark" id="rite">
  <div class="container">
    <h2 class="section__title" id="rite-titre"></h2>
    <div class="section__divider"></div>
    <p class="section__intro" id="rite-intro"></p>
    <div class="cards-grid" id="rite-cards"></div>
  </div>
</section>

<!-- CHEFS DE L'ORDRE — généré par app.js -->
<section class="section section--gold-border" id="chefs">
  <div class="container">
    <h2 class="section__title" id="chefs-titre"></h2>
    <div class="section__divider"></div>
    <div class="chefs-grid" id="chefs-grid"></div>
  </div>
</section>

<!-- LIVRES — généré par app.js -->
<section class="section section--dark" id="livres">
  <div class="container">
    <h2 class="section__title" id="livres-titre"></h2>
    <div class="section__divider"></div>
    <div class="books-grid" id="books-grid"></div>
  </div>
</section>

<!-- TUILAGE — généré par app.js -->
<section class="section section--tuilage" id="tuilage">
  <div class="container container--narrow">
    <h2 class="section__title" id="tuilage-titre"></h2>
    <div class="section__divider"></div>
    <p class="tuilage__intro" id="tuilage-intro"></p>
    <div id="tuilage-zone"></div>
  </div>
</section>

<!-- CONTACT — généré par app.js -->
<section class="section" id="contact">
  <div class="container container--narrow">
    <h2 class="section__title" id="contact-titre"></h2>
    <div class="section__divider"></div>
    <p class="section__intro" id="contact-intro"></p>
    <div class="contact-block" id="contact-block"></div>
  </div>
</section>

<!-- FOOTER — généré par app.js -->
<footer class="footer" id="footer">
  <div class="footer__content" id="footer-content"></div>
</footer>

<!-- scripts : config → app (construit le DOM) → images (injecte les photos) -->
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/images.js"></script>

</body>
</html>
