[pytest]
testpaths = tests
python_files = test_*.py
# asyncio_mode=auto : les tests asynchrones n'ont pas besoin d'être décorés
# un par un. Sans cela, un test async sans décorateur est silencieusement
# considéré comme réussi — le pire des faux positifs.
asyncio_mode = auto
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
